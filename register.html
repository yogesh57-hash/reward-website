<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RewardHub - Register</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    font-family: Arial, sans-serif;
}

body {
    background: #f5f7fb;
    color: #222;
}

header {
    background: #111827;
    color: white;
    padding: 18px 20px;
    text-align: center;
}

.logo {
    font-size: 22px;
    font-weight: bold;
}

.register-box {
    width: 90%;
    max-width: 400px;
    margin: 40px auto;
    background: white;
    padding: 30px 25px;
    border-radius: 12px;
    box-shadow: 0 3px 12px rgba(0,0,0,0.08);
}

h2 {
    text-align: center;
    margin-bottom: 25px;
}

label {
    display: block;
    margin-bottom: 7px;
    font-weight: bold;
}

input {
    width: 100%;
    padding: 13px;
    margin-bottom: 17px;
    border: 1px solid #ddd;
    border-radius: 8px;
    font-size: 15px;
}

button {
    width: 100%;
    padding: 13px;
    background: #2563eb;
    color: white;
    border: none;
    border-radius: 8px;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
}

.message {
    text-align: center;
    margin-top: 15px;
    font-size: 14px;
}

.login {
    text-align: center;
    margin-top: 20px;
}

.login a {
    color: #2563eb;
    text-decoration: none;
    font-weight: bold;
}
</style>
</head>

<body>

<header>
    <div class="logo">RewardHub</div>
</header>

<div class="register-box">

    <h2>Create Account</h2>

    <form id="registerForm">

        <label>Full Name</label>
        <input type="text" id="name" placeholder="Enter your name" required>

        <label>Mobile Number</label>
        <input type="tel" id="mobile" placeholder="Enter mobile number"
               pattern="[0-9]{10}" maxlength="10" required>

        <label>Email</label>
        <input type="email" id="email" placeholder="Enter your email" required>

        <label>Password</label>
        <input type="password" id="password" placeholder="Create password" minlength="6" required>

        <label>Confirm Password</label>
        <input type="password" id="confirmPassword" placeholder="Confirm password" minlength="6" required>

        <button type="submit">Create Account</button>

    </form>

    <div class="message" id="message"></div>

    <div class="login">
        Already have an account?
        <a href="login.html">Login</a>
    </div>

</div>

<script>
document.getElementById("registerForm").addEventListener("submit", function(event) {
    event.preventDefault();

    const password = document.getElementById("password").value;
    const confirmPassword = document.getElementById("confirmPassword").value;
    const message = document.getElementById("message");

    if (password !== confirmPassword) {
        message.innerText = "Passwords do not match.";
        return;
    }

    message.innerText =
        "Registration system will be connected in the next step.";
});
</script>

</body>
</html>
