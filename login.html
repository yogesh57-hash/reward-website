<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RewardHub - Login</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    font-family: Arial, sans-serif;
}

body {
    background: #f5f7fb;
    color: #222;
}

header {
    background: #111827;
    color: white;
    padding: 18px 20px;
    text-align: center;
}

.logo {
    font-size: 22px;
    font-weight: bold;
}

.login-box {
    width: 90%;
    max-width: 400px;
    margin: 60px auto;
    background: white;
    padding: 30px 25px;
    border-radius: 12px;
    box-shadow: 0 3px 12px rgba(0,0,0,0.08);
}

h2 {
    text-align: center;
    margin-bottom: 25px;
}

label {
    display: block;
    margin-bottom: 7px;
    font-weight: bold;
}

input {
    width: 100%;
    padding: 13px;
    margin-bottom: 18px;
    border: 1px solid #ddd;
    border-radius: 8px;
    font-size: 15px;
}

button {
    width: 100%;
    padding: 13px;
    background: #2563eb;
    color: white;
    border: none;
    border-radius: 8px;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
}

button:active {
    opacity: 0.8;
}

.message {
    text-align: center;
    margin-top: 15px;
    color: #666;
    font-size: 14px;
}

.register {
    text-align: center;
    margin-top: 20px;
}

.register a {
    color: #2563eb;
    text-decoration: none;
    font-weight: bold;
}
</style>
</head>

<body>

<header>
    <div class="logo">RewardHub</div>
</header>

<div class="login-box">

    <h2>Login</h2>

    <form id="loginForm">

        <label>Email</label>
        <input type="email" id="email" placeholder="Enter your email" required>

        <label>Password</label>
        <input type="password" id="password" placeholder="Enter your password" required>

        <button type="submit">Login</button>

    </form>

    <div class="message" id="message"></div>

    <div class="register">
        Don't have an account?
        <a href="register.html">Register</a>
    </div>

</div>

<script>
document.getElementById("loginForm").addEventListener("submit", function(event) {
    event.preventDefault();

    document.getElementById("message").innerText =
        "Login system will be connected in the next step.";
});
</script>

</body>
</html>
